name: TransactIQ CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Feature & Unit Tests (PHP 8.4 + PostgreSQL 16 + Redis 7)
  # ============================================================================
  backend-tests:
    name: Backend Test Suite (PHP 8.4 + Postgres + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transactiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Marhab023$
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, bcmath, pcntl, opcache, zip, mbstring
          coverage: none

      - name: Verify PHP Extensions
        run: |
          php -v
          php -m | grep -E "pdo_pgsql|redis|bcmath|pcntl"

      - name: Get Composer Cache Directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Application Key & Environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Database Migrations & Seeders
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: transactiq
          DB_USERNAME: postgres
          DB_PASSWORD: Marhab023$
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan migrate --force --seed

      - name: Execute Feature & Security Test Suite (60 Tests)
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: transactiq
          DB_USERNAME: postgres
          DB_PASSWORD: Marhab023$
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test

  # ============================================================================
  # 2. Frontend Build & TypeScript Validation (React 19 + TypeScript + Vite)
  # ============================================================================
  frontend-build:
    name: Frontend Build & Typecheck (React 19 + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Verification & Production Build
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # 3. Docker Container Build Verification
  # ============================================================================
  docker-verification:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: transactiq-backend:ci-check

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: transactiq-frontend:ci-check
