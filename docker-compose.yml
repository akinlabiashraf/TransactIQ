services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 ACID Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: transactiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-transactiq}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transactiq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-transactiq}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis 7 In-Memory Cache & Mutex Lock
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: transactiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - transactiq-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Core Laravel API (PHP 8.4-FPM)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transactiq-backend
    restart: unless-stopped
    environment:
      APP_NAME: TransactIQ
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:XG8d2Lq3Z2JbYvQ5R1eP7sW9kM4nB0vA6cE8xZ1yU3w=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-transactiq}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      AI_FRAUD_URL: http://ai-service:8001/predict/fraud
    volumes:
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transactiq-network

  # ----------------------------------------------------------------------------
  # 4. Asynchronous Queue Worker (Webhooks, Settlements, Event Processing)
  # ----------------------------------------------------------------------------
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transactiq-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      APP_NAME: TransactIQ
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:XG8d2Lq3Z2JbYvQ5R1eP7sW9kM4nB0vA6cE8xZ1yU3w=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-transactiq}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transactiq-network

  # ----------------------------------------------------------------------------
  # 5. Backend Nginx Web Gateway (Reverse Proxy to FastCGI)
  # ----------------------------------------------------------------------------
  backend-web:
    image: nginx:alpine
    container_name: transactiq-backend-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/backend/public
    depends_on:
      - backend
    networks:
      - transactiq-network

  # ----------------------------------------------------------------------------
  # 6. React Operations Portal (Nginx Static + API Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transactiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend-web
    networks:
      - transactiq-network

  # ----------------------------------------------------------------------------
  # 7. AI Fraud Detection Microservice (FastAPI + scikit-learn Isolation Forest)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: transactiq-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - transactiq-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

# ------------------------------------------------------------------------------
# Persistent Docker Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  transactiq-network:
    driver: bridge
